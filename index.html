<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ouchi Colon ころころレース</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #fff7df;
      --panel: rgba(22, 30, 45, 0.82);
      --accent: #ffca3a;
      --accent-2: #4ecdc4;
      --danger: #ff5a5f;
      --shadow: rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111827;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
      user-select: none;
    }

    body {
      display: grid;
      place-items: center;
    }

    .game-shell {
      position: relative;
      width: min(100vw, 430px);
      height: min(100vh, 932px);
      max-height: 100vh;
      overflow: hidden;
      background: #0b1220;
      box-shadow: 0 20px 60px var(--shadow);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      background: #84d7f7;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
      pointer-events: none;
    }

    .title-screen {
      background:
        linear-gradient(rgba(8, 13, 25, 0.16), rgba(8, 13, 25, 0.52)),
        radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.18), transparent 26%);
    }

    .title-block {
      margin-top: 54px;
      text-align: center;
      text-shadow: 0 4px 0 rgba(0, 0, 0, 0.24);
    }

    .brand {
      margin: 0;
      font-size: clamp(32px, 10vw, 46px);
      line-height: 1.02;
      letter-spacing: 0;
      font-weight: 900;
    }

    .subtitle {
      margin: 10px 0 0;
      font-size: 18px;
      font-weight: 800;
      color: #ffe66d;
    }

    .title-actions {
      display: grid;
      gap: 14px;
      pointer-events: auto;
    }

    button {
      min-height: 46px;
      border: 0;
      border-radius: 8px;
      color: #172033;
      background: var(--ink);
      font: inherit;
      font-weight: 850;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.24);
      cursor: pointer;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.24);
    }

    .start-button {
      min-height: 60px;
      background: var(--accent);
      font-size: 22px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 7px;
    }

    .menu-grid button {
      min-height: 50px;
      padding: 4px 2px;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.18);
      font-size: 12px;
      line-height: 1.1;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.26);
    }

    .race-ui {
      justify-content: flex-start;
      padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
      pointer-events: none;
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
    }

    .hud-item {
      min-height: 42px;
      padding: 5px 6px;
      border-radius: 8px;
      background: rgba(14, 22, 34, 0.74);
      border: 1px solid rgba(255, 255, 255, 0.18);
      text-align: center;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.32);
    }

    .hud-label {
      display: block;
      color: #9ee7ff;
      font-size: 10px;
      font-weight: 900;
    }

    .hud-value {
      display: block;
      margin-top: 1px;
      font-size: 18px;
      font-weight: 900;
    }

    .jump-button {
      position: absolute;
      right: 16px;
      bottom: max(20px, env(safe-area-inset-bottom));
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: var(--accent-2);
      pointer-events: auto;
      font-size: 15px;
    }

    .back-button {
      position: absolute;
      left: 12px;
      bottom: max(24px, env(safe-area-inset-bottom));
      width: 58px;
      min-height: 38px;
      color: var(--ink);
      background: rgba(14, 22, 34, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.18);
      pointer-events: auto;
      font-size: 12px;
      box-shadow: none;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <main class="game-shell" aria-label="Ouchi Colon ころころレース">
    <canvas id="gameCanvas" width="390" height="844"></canvas>

    <section id="titleScreen" class="overlay title-screen">
      <div class="title-block">
        <h1 class="brand">Ouchi Colon</h1>
        <p class="subtitle">ころころレース</p>
      </div>
      <div class="title-actions">
        <button id="startButton" class="start-button" type="button">スタート</button>
        <nav class="menu-grid" aria-label="メニュー">
          <button type="button">キャラクター</button>
          <button type="button">コース</button>
          <button type="button">せってい</button>
          <button type="button">ランキング</button>
          <button type="button">おしらせ</button>
        </nav>
      </div>
    </section>

    <section id="raceUi" class="overlay race-ui hidden" aria-label="レース情報">
      <div class="hud">
        <div class="hud-item">
          <span class="hud-label">LAP</span>
          <span id="lapValue" class="hud-value">1/3</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">STAR</span>
          <span id="starValue" class="hud-value">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">SPEED</span>
          <span id="speedValue" class="hud-value">0</span>
        </div>
      </div>
      <button id="backButton" class="back-button" type="button">TITLE</button>
      <button id="jumpButton" class="jump-button" type="button">JUMP</button>
    </section>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const titleScreen = document.getElementById("titleScreen");
      const raceUi = document.getElementById("raceUi");
      const startButton = document.getElementById("startButton");
      const backButton = document.getElementById("backButton");
      const jumpButton = document.getElementById("jumpButton");
      const lapValue = document.getElementById("lapValue");
      const starValue = document.getElementById("starValue");
      const speedValue = document.getElementById("speedValue");

      const VIEW_W = 390;
      const VIEW_H = 844;
      const HORIZON = 238;
      const ROAD_TOP = 74;
      const ROAD_BOTTOM = 336;
      const COURSE_LENGTH = 3400;
      const keys = new Set();

      let state = "title";
      let lastTime = performance.now();

      const player = {
        lane: 0,
        targetLane: 0,
        y: 0,
        jump: 0,
        jumpVelocity: 0,
        speed: 0,
        distance: 0,
        lap: 1,
        stars: 0,
        hitCooldown: 0
      };

      let worldObjects = [];

      function resetRace() {
        player.lane = 0;
        player.targetLane = 0;
        player.y = 0;
        player.jump = 0;
        player.jumpVelocity = 0;
        player.speed = 92;
        player.distance = 0;
        player.lap = 1;
        player.stars = 0;
        player.hitCooldown = 0;
        worldObjects = makeObjects();
      }

      function makeObjects() {
        const objects = [];
        for (let i = 0; i < 54; i += 1) {
          const kindRoll = i % 6;
          objects.push({
            id: i,
            kind: kindRoll === 0 ? "block" : kindRoll === 3 ? "enemy" : "star",
            lane: [-0.72, 0, 0.72][(i * 7) % 3],
            distance: 260 + i * 155 + (i % 4) * 38,
            taken: false
          });
        }
        return objects;
      }

      function startRace() {
        state = "race";
        resetRace();
        titleScreen.classList.add("hidden");
        raceUi.classList.remove("hidden");
      }

      function showTitle() {
        state = "title";
        titleScreen.classList.remove("hidden");
        raceUi.classList.add("hidden");
      }

      function jump() {
        if (state !== "race" || player.jump > 0.01) {
          return;
        }
        player.jumpVelocity = 9.8;
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function project(distanceAhead, lane) {
        const depth = clamp(distanceAhead / 900, 0, 1);
        const scale = 1 - depth;
        const roadHalf = lerp(ROAD_TOP, ROAD_BOTTOM, scale);
        const x = VIEW_W / 2 + lane * roadHalf;
        const y = lerp(HORIZON + 6, VIEW_H - 126, scale);
        return { x, y, scale, roadHalf };
      }

      function drawSky() {
        const sky = ctx.createLinearGradient(0, 0, 0, HORIZON + 90);
        sky.addColorStop(0, "#61c7ef");
        sky.addColorStop(0.72, "#b8f2ff");
        sky.addColorStop(1, "#f7f4c8");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, VIEW_W, VIEW_H);

        ctx.fillStyle = "#fff1a8";
        ctx.beginPath();
        ctx.arc(326, 78, 30, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#5eb56d";
        ctx.beginPath();
        ctx.moveTo(0, HORIZON + 36);
        ctx.lineTo(80, HORIZON - 18);
        ctx.lineTo(158, HORIZON + 34);
        ctx.lineTo(234, HORIZON - 28);
        ctx.lineTo(390, HORIZON + 46);
        ctx.lineTo(390, VIEW_H);
        ctx.lineTo(0, VIEW_H);
        ctx.closePath();
        ctx.fill();
      }

      function drawRoad() {
        ctx.fillStyle = "#2f9957";
        ctx.fillRect(0, HORIZON, VIEW_W, VIEW_H - HORIZON);

        ctx.fillStyle = "#5a5268";
        ctx.beginPath();
        ctx.moveTo(VIEW_W / 2 - ROAD_TOP, HORIZON);
        ctx.lineTo(VIEW_W / 2 + ROAD_TOP, HORIZON);
        ctx.lineTo(VIEW_W / 2 + ROAD_BOTTOM, VIEW_H);
        ctx.lineTo(VIEW_W / 2 - ROAD_BOTTOM, VIEW_H);
        ctx.closePath();
        ctx.fill();

        for (let i = 0; i < 18; i += 1) {
          const stripe = (i * 76 - (player.distance % 76)) / 900;
          const near = clamp(stripe, 0, 1);
          const far = clamp(stripe + 0.035, 0, 1);
          const y1 = lerp(VIEW_H, HORIZON, near);
          const y2 = lerp(VIEW_H, HORIZON, far);
          const half1 = lerp(ROAD_BOTTOM, ROAD_TOP, near);
          const half2 = lerp(ROAD_BOTTOM, ROAD_TOP, far);

          ctx.fillStyle = i % 2 === 0 ? "#fff7df" : "#f25555";
          ctx.beginPath();
          ctx.moveTo(VIEW_W / 2 - half1, y1);
          ctx.lineTo(VIEW_W / 2 - half1 + 16, y1);
          ctx.lineTo(VIEW_W / 2 - half2 + 4, y2);
          ctx.lineTo(VIEW_W / 2 - half2, y2);
          ctx.closePath();
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(VIEW_W / 2 + half1, y1);
          ctx.lineTo(VIEW_W / 2 + half1 - 16, y1);
          ctx.lineTo(VIEW_W / 2 + half2 - 4, y2);
          ctx.lineTo(VIEW_W / 2 + half2, y2);
          ctx.closePath();
          ctx.fill();
        }

        ctx.strokeStyle = "rgba(255, 255, 255, 0.45)";
        ctx.lineWidth = 2;
        for (const lane of [-0.36, 0.36]) {
          ctx.beginPath();
          for (let i = 0; i <= 18; i += 1) {
            const t = i / 18;
            const half = lerp(ROAD_TOP, ROAD_BOTTOM, t);
            const x = VIEW_W / 2 + lane * half;
            const y = lerp(HORIZON, VIEW_H, t);
            if (i === 0) {
              ctx.moveTo(x, y);
            } else {
              ctx.lineTo(x, y);
            }
          }
          ctx.stroke();
        }
      }

      function drawStar(x, y, size) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(performance.now() / 260);
        ctx.fillStyle = "#ffdf3f";
        ctx.strokeStyle = "#8a5d00";
        ctx.lineWidth = Math.max(1, size * 0.08);
        ctx.beginPath();
        for (let i = 0; i < 10; i += 1) {
          const radius = i % 2 === 0 ? size : size * 0.45;
          const angle = -Math.PI / 2 + i * Math.PI / 5;
          const px = Math.cos(angle) * radius;
          const py = Math.sin(angle) * radius;
          if (i === 0) {
            ctx.moveTo(px, py);
          } else {
            ctx.lineTo(px, py);
          }
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      function drawObstacle(object, point) {
        const size = lerp(8, 60, point.scale);
        if (object.kind === "star") {
          drawStar(point.x, point.y - size * 0.55, size * 0.42);
          return;
        }

        if (object.kind === "enemy") {
          ctx.fillStyle = "#7f4ad8";
          ctx.beginPath();
          ctx.arc(point.x, point.y - size * 0.34, size * 0.38, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#fff7df";
          ctx.fillRect(point.x - size * 0.2, point.y - size * 0.42, size * 0.12, size * 0.12);
          ctx.fillRect(point.x + size * 0.08, point.y - size * 0.42, size * 0.12, size * 0.12);
          return;
        }

        ctx.fillStyle = "#d9534f";
        ctx.fillRect(point.x - size * 0.45, point.y - size * 0.78, size * 0.9, size * 0.74);
        ctx.fillStyle = "rgba(255, 255, 255, 0.22)";
        ctx.fillRect(point.x - size * 0.36, point.y - size * 0.7, size * 0.74, size * 0.16);
      }

      function drawPlayer() {
        const baseX = VIEW_W / 2 + player.lane * 118;
        const baseY = VIEW_H - 118 - player.jump * 52;
        const squash = player.jump > 0 ? 1 : 1 + Math.sin(performance.now() / 100) * 0.03;

        ctx.save();
        ctx.translate(baseX, baseY);
        ctx.scale(1, squash);

        ctx.fillStyle = "rgba(0, 0, 0, 0.22)";
        ctx.beginPath();
        ctx.ellipse(0, 54 + player.jump * 52, 42, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ff8c42";
        ctx.beginPath();
        ctx.arc(0, 0, 38, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#f25f5c";
        ctx.beginPath();
        ctx.arc(0, -10, 29, Math.PI, 0);
        ctx.fill();

        ctx.fillStyle = "#22304a";
        ctx.fillRect(-28, 5, 56, 18);
        ctx.fillStyle = "#ffe66d";
        ctx.fillRect(-17, 12, 34, 8);

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(-22, -10, 12, 12);
        ctx.fillRect(10, -10, 12, 12);
        ctx.fillStyle = "#1d2738";
        ctx.fillRect(-18, -7, 6, 8);
        ctx.fillRect(14, -7, 6, 8);

        ctx.fillStyle = "#2b3146";
        ctx.fillRect(-24, 34, 16, 18);
        ctx.fillRect(8, 34, 16, 18);

        ctx.restore();
      }

      function drawTitleScene() {
        drawSky();
        drawRoad();
        player.distance += 0.9;
        const demoPoint = project(135, Math.sin(performance.now() / 800) * 0.55);
        drawStar(demoPoint.x, demoPoint.y - 34, 22);
      }

      function updateRace(delta) {
        const direction = (keys.has("ArrowRight") || keys.has("KeyD") ? 1 : 0) - (keys.has("ArrowLeft") || keys.has("KeyA") ? 1 : 0);
        if (direction !== 0) {
          player.targetLane = clamp(player.targetLane + direction * delta * 1.7, -1, 1);
        }
        player.lane = lerp(player.lane, player.targetLane, clamp(delta * 9, 0, 1));

        player.speed = lerp(player.speed, 120, delta * 0.16);
        player.distance += player.speed * delta;

        if (player.distance >= COURSE_LENGTH) {
          player.distance -= COURSE_LENGTH;
          player.lap = player.lap === 3 ? 1 : player.lap + 1;
          worldObjects = makeObjects();
        }

        if (player.jumpVelocity !== 0 || player.jump > 0) {
          player.jump += player.jumpVelocity * delta;
          player.jumpVelocity -= 24 * delta;
          if (player.jump <= 0) {
            player.jump = 0;
            player.jumpVelocity = 0;
          }
        }

        player.hitCooldown = Math.max(0, player.hitCooldown - delta);

        for (const object of worldObjects) {
          if (object.taken) {
            continue;
          }

          let ahead = object.distance - player.distance;
          if (ahead < -90) {
            object.distance += COURSE_LENGTH;
            object.taken = false;
            ahead = object.distance - player.distance;
          }

          if (ahead > 18 && ahead < 82 && Math.abs(object.lane - player.lane) < 0.34) {
            if (object.kind === "star") {
              object.taken = true;
              player.stars += 1;
              player.speed = Math.min(150, player.speed + 8);
            } else if (player.hitCooldown <= 0 && !(player.jump > 0.45 && object.kind === "block")) {
              player.speed = 38;
              player.hitCooldown = 0.9;
            }
          }
        }

        lapValue.textContent = `${player.lap}/3`;
        starValue.textContent = String(player.stars);
        speedValue.textContent = String(Math.round(player.speed));
      }

      function drawRace() {
        drawSky();
        drawRoad();

        const visible = worldObjects
          .filter((object) => !object.taken)
          .map((object) => ({ object, ahead: object.distance - player.distance }))
          .filter((entry) => entry.ahead > 20 && entry.ahead < 900)
          .sort((a, b) => b.ahead - a.ahead);

        for (const entry of visible) {
          drawObstacle(entry.object, project(entry.ahead, entry.object.lane));
        }

        drawPlayer();

        if (player.hitCooldown > 0) {
          ctx.fillStyle = "rgba(255, 90, 95, 0.22)";
          ctx.fillRect(0, 0, VIEW_W, VIEW_H);
        }
      }

      function loop(now) {
        const delta = Math.min(0.033, (now - lastTime) / 1000);
        lastTime = now;

        if (state === "race") {
          updateRace(delta);
          drawRace();
        } else {
          drawTitleScene();
        }

        requestAnimationFrame(loop);
      }

      function handlePointer(event) {
        if (state !== "race") {
          return;
        }

        const rect = canvas.getBoundingClientRect();
        const x = event.clientX - rect.left;
        if (x < rect.width * 0.42) {
          player.targetLane = clamp(player.targetLane - 0.42, -1, 1);
        } else if (x > rect.width * 0.58) {
          player.targetLane = clamp(player.targetLane + 0.42, -1, 1);
        }
      }

      startButton.addEventListener("click", startRace);
      backButton.addEventListener("click", showTitle);
      jumpButton.addEventListener("click", jump);
      canvas.addEventListener("pointerdown", handlePointer);

      window.addEventListener("keydown", (event) => {
        keys.add(event.code);
        if (event.code === "Space" || event.code === "ArrowUp") {
          event.preventDefault();
          jump();
        }
      });

      window.addEventListener("keyup", (event) => {
        keys.delete(event.code);
      });

      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
