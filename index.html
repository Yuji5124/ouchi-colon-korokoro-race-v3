<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ouchi Colon ころころレース</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #fff7df;
      --panel: rgba(22, 30, 45, 0.82);
      --accent: #ffca3a;
      --accent-2: #4ecdc4;
      --danger: #ff5a5f;
      --shadow: rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111827;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
      user-select: none;
    }

    body {
      display: grid;
      place-items: center;
    }

    .game-shell {
      position: relative;
      width: min(100vw, 430px);
      height: min(100vh, 932px);
      max-height: 100vh;
      overflow: hidden;
      background: #0b1220;
      box-shadow: 0 20px 60px var(--shadow);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      background: #84d7f7;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
      pointer-events: none;
    }

    .title-screen {
      background:
        linear-gradient(rgba(255, 247, 223, 0.12), rgba(255, 215, 122, 0.26)),
        radial-gradient(circle at 50% 16%, rgba(255, 255, 255, 0.42), transparent 30%);
    }

    .title-block {
      margin-top: 42px;
      text-align: center;
      text-shadow:
        0 4px 0 rgba(255, 146, 83, 0.52),
        0 7px 18px rgba(80, 48, 22, 0.22);
    }

    .brand {
      margin: 0;
      font-size: clamp(32px, 10vw, 46px);
      line-height: 1.02;
      letter-spacing: 0;
      font-weight: 900;
      color: #fff9e8;
    }

    .subtitle {
      margin: 10px 0 0;
      font-size: 18px;
      font-weight: 900;
      color: #25335b;
      text-shadow:
        0 2px 0 rgba(255, 255, 255, 0.8),
        0 4px 8px rgba(255, 159, 67, 0.28);
    }

    .title-actions {
      display: grid;
      gap: 14px;
      pointer-events: auto;
    }

    button {
      min-height: 46px;
      border: 0;
      border-radius: 8px;
      color: #172033;
      background: var(--ink);
      font: inherit;
      font-weight: 850;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.24);
      cursor: pointer;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.24);
    }

    .start-button {
      min-height: 60px;
      background: linear-gradient(#ffe66d, #ffb347);
      font-size: 22px;
      border: 3px solid #fff6d8;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    .menu-grid button {
      min-height: 56px;
      padding: 5px 3px;
      color: #26345d;
      background: linear-gradient(#ffffff, #dff7ff);
      border: 2px solid rgba(255, 255, 255, 0.9);
      font-size: 12px;
      line-height: 1.12;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
      box-shadow: 0 5px 0 rgba(62, 113, 147, 0.34);
    }

    .race-ui {
      justify-content: flex-start;
      padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
      pointer-events: none;
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
    }

    .hud-item {
      min-height: 42px;
      padding: 6px 6px;
      border-radius: 8px;
      background: linear-gradient(#fffdf0, #ffe9a8);
      border: 3px solid rgba(255, 255, 255, 0.94);
      text-align: center;
      box-shadow: 0 4px 0 rgba(86, 72, 45, 0.26);
      text-shadow: none;
    }

    .hud-label {
      display: block;
      color: #2f6f9f;
      font-size: 10px;
      font-weight: 900;
    }

    .hud-value {
      display: block;
      margin-top: 1px;
      font-size: 18px;
      font-weight: 900;
      color: #1f2d4d;
    }

    .jump-button {
      position: absolute;
      right: 16px;
      bottom: max(20px, env(safe-area-inset-bottom));
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 25%, #f9ffff, #69dbd2 52%, #2fafa6);
      border: 3px solid rgba(255, 255, 255, 0.88);
      pointer-events: auto;
      font-size: 15px;
    }

    .back-button {
      position: absolute;
      left: 12px;
      bottom: max(24px, env(safe-area-inset-bottom));
      width: 58px;
      min-height: 38px;
      color: var(--ink);
      background: rgba(14, 22, 34, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.18);
      pointer-events: auto;
      font-size: 12px;
      box-shadow: none;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <main class="game-shell" aria-label="Ouchi Colon ころころレース">
    <canvas id="gameCanvas" width="390" height="844"></canvas>

    <section id="titleScreen" class="overlay title-screen">
      <div class="title-block">
        <h1 class="brand">Ouchi Colon</h1>
        <p class="subtitle">ころころレース</p>
      </div>
      <div class="title-actions">
        <button id="startButton" class="start-button" type="button">スタート</button>
        <nav class="menu-grid" aria-label="メニュー">
          <button type="button">キャラクター</button>
          <button type="button">コース</button>
          <button type="button">せってい</button>
          <button type="button">ランキング</button>
          <button type="button">おしらせ</button>
        </nav>
      </div>
    </section>

    <section id="raceUi" class="overlay race-ui hidden" aria-label="レース情報">
      <div class="hud">
        <div class="hud-item">
          <span class="hud-label">LAP</span>
          <span id="lapValue" class="hud-value">1/3</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">STAR</span>
          <span id="starValue" class="hud-value">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">SPEED</span>
          <span id="speedValue" class="hud-value">0</span>
        </div>
      </div>
      <button id="backButton" class="back-button" type="button">TITLE</button>
      <button id="jumpButton" class="jump-button" type="button">JUMP</button>
    </section>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const titleScreen = document.getElementById("titleScreen");
      const raceUi = document.getElementById("raceUi");
      const startButton = document.getElementById("startButton");
      const backButton = document.getElementById("backButton");
      const jumpButton = document.getElementById("jumpButton");
      const lapValue = document.getElementById("lapValue");
      const starValue = document.getElementById("starValue");
      const speedValue = document.getElementById("speedValue");

      const VIEW_W = 390;
      const VIEW_H = 844;
      const HORIZON = 238;
      const ROAD_TOP = 74;
      const ROAD_BOTTOM = 336;
      const COURSE_LENGTH = 3400;
      const keys = new Set();

      let state = "title";
      let lastTime = performance.now();

      const player = {
        lane: 0,
        targetLane: 0,
        y: 0,
        jump: 0,
        jumpVelocity: 0,
        speed: 0,
        distance: 0,
        lap: 1,
        stars: 0,
        hitCooldown: 0
      };

      let worldObjects = [];

      function resetRace() {
        player.lane = 0;
        player.targetLane = 0;
        player.y = 0;
        player.jump = 0;
        player.jumpVelocity = 0;
        player.speed = 92;
        player.distance = 0;
        player.lap = 1;
        player.stars = 0;
        player.hitCooldown = 0;
        worldObjects = makeObjects();
      }

      function makeObjects() {
        const objects = [];
        for (let i = 0; i < 54; i += 1) {
          const kindRoll = i % 8;
          objects.push({
            id: i,
            kind: kindRoll === 0 ? "block" : kindRoll === 3 ? "enemy" : kindRoll === 5 ? "jumpPad" : "star",
            lane: [-0.72, 0, 0.72][(i * 7) % 3],
            distance: 260 + i * 155 + (i % 4) * 38,
            taken: false
          });
        }
        return objects;
      }

      function startRace() {
        state = "race";
        resetRace();
        titleScreen.classList.add("hidden");
        raceUi.classList.remove("hidden");
      }

      function showTitle() {
        state = "title";
        titleScreen.classList.remove("hidden");
        raceUi.classList.add("hidden");
      }

      function jump() {
        if (state !== "race" || player.jump > 0.01) {
          return;
        }
        player.jumpVelocity = 9.8;
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function project(distanceAhead, lane) {
        const depth = clamp(distanceAhead / 900, 0, 1);
        const scale = 1 - depth;
        const roadHalf = lerp(ROAD_TOP, ROAD_BOTTOM, scale);
        const x = VIEW_W / 2 + lane * roadHalf;
        const y = lerp(HORIZON + 6, VIEW_H - 126, scale);
        return { x, y, scale, roadHalf };
      }

      function drawRoomBackground(isTitle = false) {
        const sky = ctx.createLinearGradient(0, 0, 0, HORIZON + 90);
        sky.addColorStop(0, isTitle ? "#ffe7a8" : "#bdeeff");
        sky.addColorStop(0.62, isTitle ? "#ffd3d9" : "#e9fbff");
        sky.addColorStop(1, "#fff4d2");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, VIEW_W, VIEW_H);

        ctx.fillStyle = "#ffef98";
        ctx.beginPath();
        ctx.arc(326, 70, isTitle ? 38 : 28, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#fff9e8";
        ctx.fillRect(34, 52, 126, 86);
        ctx.fillStyle = "#85d9ff";
        ctx.fillRect(42, 60, 52, 70);
        ctx.fillRect(100, 60, 52, 70);
        ctx.strokeStyle = "#e8a55d";
        ctx.lineWidth = 5;
        ctx.strokeRect(34, 52, 126, 86);
        ctx.beginPath();
        ctx.moveTo(97, 55);
        ctx.lineTo(97, 136);
        ctx.moveTo(39, 95);
        ctx.lineTo(156, 95);
        ctx.stroke();
        ctx.fillStyle = "rgba(255, 255, 255, 0.42)";
        ctx.fillRect(48, 66, 24, 10);
        ctx.fillRect(108, 66, 24, 10);

        ctx.fillStyle = "#9a6b4f";
        ctx.fillRect(238, 126, 104, 56);
        ctx.fillStyle = "#72503f";
        ctx.fillRect(248, 116, 84, 22);
        ctx.fillStyle = "#f2b36b";
        ctx.fillRect(252, 138, 28, 34);
        ctx.fillRect(298, 138, 28, 34);

        ctx.fillStyle = "#6f5c47";
        ctx.fillRect(14, 170, 76, 12);
        ctx.fillRect(24, 182, 8, 42);
        ctx.fillRect(72, 182, 8, 42);
        ctx.fillStyle = "#f7c9d3";
        ctx.beginPath();
        ctx.roundRect(16, 144, 72, 30, 8);
        ctx.fill();

        ctx.fillStyle = "#c27842";
        ctx.fillRect(328, 184, 30, 42);
        ctx.fillStyle = "#3b9d5a";
        for (const leaf of [[329, 174, 18, 8, -0.6], [357, 174, 18, 8, 0.6], [342, 154, 15, 8, 0], [333, 160, 14, 7, -0.9], [354, 160, 14, 7, 0.9]]) {
          ctx.save();
          ctx.translate(leaf[0], leaf[1]);
          ctx.rotate(leaf[4]);
          ctx.beginPath();
          ctx.ellipse(0, 0, leaf[2], leaf[3], 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        ctx.fillStyle = "#f05d5e";
        ctx.beginPath();
        ctx.arc(72, 250, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#5ac8fa";
        ctx.fillRect(290, 238, 28, 28);
        ctx.fillStyle = "#ffd166";
        ctx.beginPath();
        ctx.moveTo(48, 294);
        ctx.lineTo(76, 294);
        ctx.lineTo(62, 272);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = isTitle ? "#f8d99b" : "#69b86e";
        ctx.beginPath();
        ctx.moveTo(0, HORIZON + 36);
        ctx.lineTo(82, HORIZON + 2);
        ctx.lineTo(158, HORIZON + 34);
        ctx.lineTo(234, HORIZON - 4);
        ctx.lineTo(390, HORIZON + 46);
        ctx.lineTo(390, VIEW_H);
        ctx.lineTo(0, VIEW_H);
        ctx.closePath();
        ctx.fill();
      }

      function drawRoad() {
        ctx.fillStyle = "#f3c982";
        ctx.fillRect(0, HORIZON, VIEW_W, VIEW_H - HORIZON);

        ctx.fillStyle = "#65b7db";
        ctx.beginPath();
        ctx.moveTo(VIEW_W / 2 - ROAD_TOP, HORIZON);
        ctx.lineTo(VIEW_W / 2 + ROAD_TOP, HORIZON);
        ctx.lineTo(VIEW_W / 2 + ROAD_BOTTOM, VIEW_H);
        ctx.lineTo(VIEW_W / 2 - ROAD_BOTTOM, VIEW_H);
        ctx.closePath();
        ctx.fill();

        for (let i = 0; i < 18; i += 1) {
          const stripe = (i * 76 - (player.distance % 76)) / 900;
          const near = clamp(stripe, 0, 1);
          const far = clamp(stripe + 0.035, 0, 1);
          const y1 = lerp(VIEW_H, HORIZON, near);
          const y2 = lerp(VIEW_H, HORIZON, far);
          const half1 = lerp(ROAD_BOTTOM, ROAD_TOP, near);
          const half2 = lerp(ROAD_BOTTOM, ROAD_TOP, far);

          ctx.fillStyle = i % 2 === 0 ? "#fff7df" : "#ff8fab";
          ctx.beginPath();
          ctx.moveTo(VIEW_W / 2 - half1, y1);
          ctx.lineTo(VIEW_W / 2 - half1 + 16, y1);
          ctx.lineTo(VIEW_W / 2 - half2 + 4, y2);
          ctx.lineTo(VIEW_W / 2 - half2, y2);
          ctx.closePath();
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(VIEW_W / 2 + half1, y1);
          ctx.lineTo(VIEW_W / 2 + half1 - 16, y1);
          ctx.lineTo(VIEW_W / 2 + half2 - 4, y2);
          ctx.lineTo(VIEW_W / 2 + half2, y2);
          ctx.closePath();
          ctx.fill();
        }

        ctx.strokeStyle = "rgba(255, 255, 255, 0.62)";
        ctx.lineWidth = 2;
        for (const lane of [-0.36, 0.36]) {
          ctx.beginPath();
          for (let i = 0; i <= 18; i += 1) {
            const t = i / 18;
            const half = lerp(ROAD_TOP, ROAD_BOTTOM, t);
            const x = VIEW_W / 2 + lane * half;
            const y = lerp(HORIZON, VIEW_H, t);
            if (i === 0) {
              ctx.moveTo(x, y);
            } else {
              ctx.lineTo(x, y);
            }
          }
          ctx.stroke();
        }
      }

      function drawStar(x, y, size) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(performance.now() / 260);
        ctx.fillStyle = "#ffdf3f";
        ctx.strokeStyle = "#d98200";
        ctx.lineWidth = Math.max(1, size * 0.08);
        ctx.beginPath();
        for (let i = 0; i < 10; i += 1) {
          const radius = i % 2 === 0 ? size : size * 0.45;
          const angle = -Math.PI / 2 + i * Math.PI / 5;
          const px = Math.cos(angle) * radius;
          const py = Math.sin(angle) * radius;
          if (i === 0) {
            ctx.moveTo(px, py);
          } else {
            ctx.lineTo(px, py);
          }
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "rgba(255, 255, 255, 0.78)";
        ctx.beginPath();
        ctx.arc(-size * 0.18, -size * 0.16, size * 0.12, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawObstacle(object, point) {
        const size = lerp(8, 60, point.scale);
        if (object.kind === "star") {
          drawStar(point.x, point.y - size * 0.55, size * 0.42);
          return;
        }

        if (object.kind === "enemy") {
          ctx.fillStyle = "#8d69e8";
          ctx.beginPath();
          ctx.arc(point.x, point.y - size * 0.34, size * 0.38, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#7a5dd5";
          ctx.beginPath();
          ctx.arc(point.x - size * 0.28, point.y - size * 0.62, size * 0.16, 0, Math.PI * 2);
          ctx.arc(point.x + size * 0.28, point.y - size * 0.62, size * 0.16, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#fff7df";
          ctx.beginPath();
          ctx.arc(point.x - size * 0.14, point.y - size * 0.42, size * 0.07, 0, Math.PI * 2);
          ctx.arc(point.x + size * 0.14, point.y - size * 0.42, size * 0.07, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#4a377c";
          ctx.lineWidth = Math.max(1, size * 0.04);
          ctx.beginPath();
          ctx.arc(point.x, point.y - size * 0.25, size * 0.12, 0, Math.PI);
          ctx.stroke();
          return;
        }

        if (object.kind === "jumpPad") {
          ctx.fillStyle = "#6ee7f2";
          ctx.beginPath();
          ctx.roundRect(point.x - size * 0.46, point.y - size * 0.28, size * 0.92, size * 0.3, size * 0.08);
          ctx.fill();
          ctx.fillStyle = "#fff7df";
          ctx.beginPath();
          ctx.moveTo(point.x, point.y - size * 0.72);
          ctx.lineTo(point.x - size * 0.25, point.y - size * 0.32);
          ctx.lineTo(point.x + size * 0.25, point.y - size * 0.32);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = "#2c9aa8";
          ctx.lineWidth = Math.max(1, size * 0.05);
          ctx.stroke();
          return;
        }

        ctx.fillStyle = "#ff9f68";
        ctx.beginPath();
        ctx.roundRect(point.x - size * 0.45, point.y - size * 0.78, size * 0.9, size * 0.74, size * 0.08);
        ctx.fill();
        ctx.fillStyle = "#ffd166";
        ctx.fillRect(point.x - size * 0.34, point.y - size * 0.68, size * 0.68, size * 0.14);
        ctx.fillStyle = "#fff7df";
        ctx.beginPath();
        ctx.arc(point.x - size * 0.16, point.y - size * 0.36, size * 0.05, 0, Math.PI * 2);
        ctx.arc(point.x + size * 0.16, point.y - size * 0.36, size * 0.05, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#9d5630";
        ctx.lineWidth = Math.max(1, size * 0.035);
        ctx.strokeRect(point.x - size * 0.45, point.y - size * 0.78, size * 0.9, size * 0.74);
      }

      function drawPlayer() {
        const baseX = VIEW_W / 2 + player.lane * 118;
        const floatHeight = player.jump * 70;
        const baseY = VIEW_H - 118 - floatHeight;
        const squash = player.jump > 0 ? 1 : 1 + Math.sin(performance.now() / 100) * 0.03;

        const shadowScale = clamp(1 - player.jump * 0.32, 0.46, 1);
        ctx.fillStyle = `rgba(35, 31, 32, ${0.26 * shadowScale})`;
        ctx.beginPath();
        ctx.ellipse(baseX, VIEW_H - 64, 44 * shadowScale, 12 * shadowScale, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.translate(baseX, baseY);
        ctx.scale(1, squash);

        ctx.fillStyle = "#3aa0ff";
        ctx.beginPath();
        ctx.ellipse(-30, -24, 14, 24, -0.65, 0, Math.PI * 2);
        ctx.ellipse(30, -24, 14, 24, 0.65, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#86d8ff";
        ctx.beginPath();
        ctx.ellipse(-28, -21, 7, 14, -0.65, 0, Math.PI * 2);
        ctx.ellipse(28, -21, 7, 14, 0.65, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffd84f";
        ctx.beginPath();
        ctx.arc(0, 0, 38, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#111827";
        ctx.beginPath();
        ctx.roundRect(-26, -16, 52, 34, 14);
        ctx.fill();

        ctx.fillStyle = "#fff7df";
        ctx.beginPath();
        ctx.arc(-12, -4, 7, 0, Math.PI * 2);
        ctx.arc(12, -4, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#1d2738";
        ctx.beginPath();
        ctx.arc(-10, -3, 3, 0, Math.PI * 2);
        ctx.arc(10, -3, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#fff7df";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 6, 9, 0.1, Math.PI - 0.1);
        ctx.stroke();

        ctx.fillStyle = "#f4b000";
        ctx.beginPath();
        ctx.ellipse(-18, 34, 13, 16, 0, 0, Math.PI * 2);
        ctx.ellipse(18, 34, 13, 16, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawTitleScene() {
        drawRoomBackground(true);
        ctx.fillStyle = "rgba(255, 255, 255, 0.34)";
        ctx.beginPath();
        ctx.roundRect(34, 334, 322, 150, 18);
        ctx.fill();
        ctx.fillStyle = "#f08fb5";
        ctx.beginPath();
        ctx.arc(104, 422, 28, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#69d2e7";
        ctx.fillRect(256, 390, 48, 48);
        ctx.fillStyle = "#f9d56e";
        ctx.beginPath();
        ctx.moveTo(190, 350);
        ctx.lineTo(224, 414);
        ctx.lineTo(156, 414);
        ctx.closePath();
        ctx.fill();
        player.distance += 0.9;
        const demoPoint = project(135, Math.sin(performance.now() / 800) * 0.55);
        drawStar(demoPoint.x, demoPoint.y - 34, 22);
      }

      function updateRace(delta) {
        const direction = (keys.has("ArrowRight") || keys.has("KeyD") ? 1 : 0) - (keys.has("ArrowLeft") || keys.has("KeyA") ? 1 : 0);
        if (direction !== 0) {
          player.targetLane = clamp(player.targetLane + direction * delta * 1.7, -1, 1);
        }
        player.lane = lerp(player.lane, player.targetLane, clamp(delta * 9, 0, 1));

        player.speed = lerp(player.speed, 120, delta * 0.16);
        player.distance += player.speed * delta;

        if (player.distance >= COURSE_LENGTH) {
          player.distance -= COURSE_LENGTH;
          player.lap = player.lap === 3 ? 1 : player.lap + 1;
          worldObjects = makeObjects();
        }

        if (player.jumpVelocity !== 0 || player.jump > 0) {
          player.jump += player.jumpVelocity * delta;
          player.jumpVelocity -= 24 * delta;
          if (player.jump <= 0) {
            player.jump = 0;
            player.jumpVelocity = 0;
          }
        }

        player.hitCooldown = Math.max(0, player.hitCooldown - delta);

        for (const object of worldObjects) {
          if (object.taken) {
            continue;
          }

          let ahead = object.distance - player.distance;
          if (ahead < -90) {
            object.distance += COURSE_LENGTH;
            object.taken = false;
            ahead = object.distance - player.distance;
          }

          if (ahead > 18 && ahead < 82 && Math.abs(object.lane - player.lane) < 0.34) {
            if (object.kind === "star") {
              object.taken = true;
              player.stars += 1;
              player.speed = Math.min(150, player.speed + 8);
            } else if (object.kind === "jumpPad") {
              object.taken = true;
              player.jumpVelocity = Math.max(player.jumpVelocity, 11.5);
              player.speed = Math.min(154, player.speed + 12);
            } else if (player.hitCooldown <= 0 && !(player.jump > 0.45 && object.kind === "block")) {
              player.speed = 38;
              player.hitCooldown = 0.9;
            }
          }
        }

        lapValue.textContent = `${player.lap}/3`;
        starValue.textContent = String(player.stars);
        speedValue.textContent = String(Math.round(player.speed));
      }

      function drawRace() {
        drawRoomBackground(false);
        drawRoad();

        const visible = worldObjects
          .filter((object) => !object.taken)
          .map((object) => ({ object, ahead: object.distance - player.distance }))
          .filter((entry) => entry.ahead > 20 && entry.ahead < 900)
          .sort((a, b) => b.ahead - a.ahead);

        for (const entry of visible) {
          drawObstacle(entry.object, project(entry.ahead, entry.object.lane));
        }

        drawPlayer();

        if (player.hitCooldown > 0) {
          ctx.fillStyle = "rgba(255, 90, 95, 0.22)";
          ctx.fillRect(0, 0, VIEW_W, VIEW_H);
        }
      }

      function loop(now) {
        const delta = Math.min(0.033, (now - lastTime) / 1000);
        lastTime = now;

        if (state === "race") {
          updateRace(delta);
          drawRace();
        } else {
          drawTitleScene();
        }

        requestAnimationFrame(loop);
      }

      function handlePointer(event) {
        if (state !== "race") {
          return;
        }

        const rect = canvas.getBoundingClientRect();
        const x = event.clientX - rect.left;
        if (x < rect.width * 0.42) {
          player.targetLane = clamp(player.targetLane - 0.42, -1, 1);
        } else if (x > rect.width * 0.58) {
          player.targetLane = clamp(player.targetLane + 0.42, -1, 1);
        }
      }

      startButton.addEventListener("click", startRace);
      backButton.addEventListener("click", showTitle);
      jumpButton.addEventListener("click", jump);
      canvas.addEventListener("pointerdown", handlePointer);

      window.addEventListener("keydown", (event) => {
        keys.add(event.code);
        if (event.code === "Space" || event.code === "ArrowUp") {
          event.preventDefault();
          jump();
        }
      });

      window.addEventListener("keyup", (event) => {
        keys.delete(event.code);
      });

      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
