<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ouchi Colon ころころレース</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #fff7df;
      --panel: rgba(22, 30, 45, 0.82);
      --accent: #ffca3a;
      --accent-2: #4ecdc4;
      --danger: #ff5a5f;
      --shadow: rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111827;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
      user-select: none;
    }

    body {
      display: grid;
      place-items: center;
    }

    .game-shell {
      position: relative;
      width: min(100vw, 430px);
      height: min(100vh, 932px);
      max-height: 100vh;
      overflow: hidden;
      background: #0b1220;
      box-shadow: 0 20px 60px var(--shadow);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      background: #84d7f7;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
      pointer-events: none;
    }

    .title-screen {
      background:
        linear-gradient(rgba(255, 247, 223, 0.12), rgba(255, 215, 122, 0.26)),
        radial-gradient(circle at 50% 16%, rgba(255, 255, 255, 0.42), transparent 30%);
    }

    .title-block {
      margin-top: 42px;
      text-align: center;
      text-shadow:
        0 4px 0 rgba(255, 146, 83, 0.52),
        0 7px 18px rgba(80, 48, 22, 0.22);
    }

    .brand {
      margin: 0;
      font-size: clamp(32px, 10vw, 46px);
      line-height: 1.02;
      letter-spacing: 0;
      font-weight: 900;
      color: #fff9e8;
    }

    .subtitle {
      margin: 10px 0 0;
      font-size: 18px;
      font-weight: 900;
      color: #25335b;
      text-shadow:
        0 2px 0 rgba(255, 255, 255, 0.8),
        0 4px 8px rgba(255, 159, 67, 0.28);
    }

    .title-actions {
      display: grid;
      gap: 14px;
      pointer-events: auto;
    }

    button {
      min-height: 46px;
      border: 0;
      border-radius: 8px;
      color: #172033;
      background: var(--ink);
      font: inherit;
      font-weight: 850;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.24);
      cursor: pointer;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.24);
    }

    .start-button {
      min-height: 60px;
      background: linear-gradient(#ffe66d, #ffb347);
      font-size: 22px;
      border: 3px solid #fff6d8;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    .menu-grid button {
      min-height: 56px;
      padding: 5px 3px;
      color: #26345d;
      background: linear-gradient(#ffffff, #dff7ff);
      border: 2px solid rgba(255, 255, 255, 0.9);
      font-size: 12px;
      line-height: 1.12;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
      box-shadow: 0 5px 0 rgba(62, 113, 147, 0.34);
    }

    .race-ui {
      justify-content: flex-start;
      padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
      pointer-events: none;
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
    }

    .hud-item {
      min-height: 42px;
      padding: 6px 6px;
      border-radius: 8px;
      background: linear-gradient(#fffdf0, #ffe9a8);
      border: 3px solid rgba(255, 255, 255, 0.94);
      text-align: center;
      box-shadow: 0 4px 0 rgba(86, 72, 45, 0.26);
      text-shadow: none;
    }

    .hud-label {
      display: block;
      color: #2f6f9f;
      font-size: 10px;
      font-weight: 900;
    }

    .hud-value {
      display: block;
      margin-top: 1px;
      font-size: 18px;
      font-weight: 900;
      color: #1f2d4d;
    }

    .jump-button {
      position: absolute;
      right: 16px;
      bottom: max(20px, env(safe-area-inset-bottom));
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 25%, #f9ffff, #69dbd2 52%, #2fafa6);
      border: 3px solid rgba(255, 255, 255, 0.88);
      pointer-events: auto;
      font-size: 15px;
    }

    .back-button {
      position: absolute;
      left: 12px;
      bottom: max(24px, env(safe-area-inset-bottom));
      width: 58px;
      min-height: 38px;
      color: var(--ink);
      background: rgba(14, 22, 34, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.18);
      pointer-events: auto;
      font-size: 12px;
      box-shadow: none;
    }

    .character-screen {
      gap: 10px;
      justify-content: flex-start;
      padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
      background:
        linear-gradient(rgba(255, 246, 216, 0.78), rgba(255, 219, 160, 0.66)),
        radial-gradient(circle at 20% 8%, rgba(255, 255, 255, 0.72), transparent 28%);
      color: #26345d;
      pointer-events: auto;
    }

    .character-title {
      margin: 2px 0 0;
      color: #26345d;
      font-size: 25px;
      line-height: 1;
      font-weight: 950;
      text-align: center;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.86);
    }

    .character-stage {
      display: grid;
      grid-template-columns: 132px minmax(0, 1fr);
      gap: 12px;
      min-height: 232px;
      padding: 12px;
      border: 4px solid rgba(255, 255, 255, 0.86);
      border-radius: 8px;
      background: linear-gradient(#fffdf3, #dff8ff);
      box-shadow: 0 7px 0 rgba(110, 88, 54, 0.22);
    }

    .character-hero {
      display: grid;
      place-items: center;
      min-height: 186px;
      border-radius: 8px;
      background:
        linear-gradient(rgba(255, 255, 255, 0.52), rgba(255, 255, 255, 0.12)),
        repeating-linear-gradient(0deg, #f7d48b 0 12px, #f9df9f 12px 24px);
      border: 2px solid rgba(211, 147, 70, 0.32);
    }

    .character-portrait {
      position: relative;
      width: 106px;
      height: 120px;
      border-radius: 50%;
      background: var(--body, #ffd84f);
      box-shadow: inset 0 -10px 0 rgba(0, 0, 0, 0.08), 0 10px 0 rgba(0, 0, 0, 0.12);
    }

    .character-portrait::before,
    .character-portrait::after {
      content: "";
      position: absolute;
      top: 5px;
      width: 28px;
      height: 46px;
      border-radius: 50%;
      background: var(--ear, #3aa0ff);
      z-index: -1;
    }

    .character-portrait::before {
      left: -11px;
      transform: rotate(-28deg);
    }

    .character-portrait::after {
      right: -11px;
      transform: rotate(28deg);
    }

    .portrait-face {
      position: absolute;
      left: 18px;
      top: 33px;
      width: 70px;
      height: 48px;
      border-radius: 18px;
      background: var(--face, #111827);
    }

    .portrait-face::before,
    .portrait-face::after {
      content: "";
      position: absolute;
      top: 15px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff7df;
    }

    .portrait-face::before {
      left: 17px;
    }

    .portrait-face::after {
      right: 17px;
    }

    .character-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .character-name {
      margin: 0;
      font-size: 24px;
      line-height: 1.05;
      font-weight: 950;
      color: #1f2d4d;
    }

    .character-desc {
      min-height: 40px;
      margin: 0;
      color: #4b5573;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 750;
    }

    .stat-list {
      display: grid;
      gap: 7px;
      margin-top: auto;
    }

    .stat-row {
      display: grid;
      grid-template-columns: 82px 1fr;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 900;
      color: #26345d;
    }

    .stat-track {
      height: 14px;
      border-radius: 999px;
      background: #d7e4ef;
      overflow: hidden;
      border: 2px solid #fff;
    }

    .stat-fill {
      width: calc(var(--value) * 20%);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #69dbd2, #ffca3a);
    }

    .character-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 2px;
    }

    .character-card {
      position: relative;
      display: grid;
      place-items: center;
      gap: 4px;
      min-height: 104px;
      padding: 7px 4px 6px;
      color: #26345d;
      background: linear-gradient(#ffffff, #e8fbff);
      border: 3px solid rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      box-shadow: 0 5px 0 rgba(62, 113, 147, 0.3);
      font-size: 11px;
      line-height: 1;
    }

    .character-card.selected {
      border-color: #ffb347;
      background: linear-gradient(#fff7d2, #ffffff);
      box-shadow: 0 5px 0 rgba(199, 122, 40, 0.38);
    }

    .character-card.selected::after {
      content: "✓";
      position: absolute;
      right: 5px;
      top: 5px;
      display: grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      color: #fff;
      background: #31b46b;
      font-size: 14px;
      font-weight: 950;
    }

    .mini-portrait {
      position: relative;
      width: 44px;
      height: 48px;
      border-radius: 50%;
      background: var(--body, #ffd84f);
      box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.08);
    }

    .mini-portrait::before,
    .mini-portrait::after {
      content: "";
      position: absolute;
      top: 2px;
      width: 13px;
      height: 20px;
      border-radius: 50%;
      background: var(--ear, #3aa0ff);
      z-index: -1;
    }

    .mini-portrait::before {
      left: -5px;
      transform: rotate(-28deg);
    }

    .mini-portrait::after {
      right: -5px;
      transform: rotate(28deg);
    }

    .mini-face {
      position: absolute;
      left: 8px;
      top: 14px;
      width: 28px;
      height: 20px;
      border-radius: 8px;
      background: var(--face, #111827);
    }

    .character-actions {
      display: grid;
      grid-template-columns: 1fr 1.25fr 1fr;
      gap: 10px;
      margin-top: auto;
    }

    .character-actions button {
      min-height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.9);
      background: linear-gradient(#ffffff, #dff7ff);
      color: #26345d;
      font-size: 15px;
    }

    .character-actions .confirm-button {
      background: linear-gradient(#ffe66d, #ffb347);
      font-size: 18px;
    }

    .course-screen {
      gap: 12px;
      justify-content: flex-start;
      padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
      background:
        linear-gradient(rgba(224, 248, 255, 0.84), rgba(255, 233, 168, 0.72)),
        radial-gradient(circle at 75% 10%, rgba(255, 255, 255, 0.74), transparent 28%);
      color: #26345d;
      pointer-events: auto;
    }

    .course-title {
      margin: 2px 0 0;
      color: #26345d;
      font-size: 25px;
      line-height: 1;
      font-weight: 950;
      text-align: center;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.86);
    }

    .course-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 4px;
    }

    .course-card {
      position: relative;
      min-height: 216px;
      padding: 8px;
      border: 4px solid rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      color: #26345d;
      background: linear-gradient(#ffffff, #eafaff);
      box-shadow: 0 6px 0 rgba(62, 113, 147, 0.28);
      text-align: left;
    }

    .course-card.selected {
      border-color: #ffb347;
      background: linear-gradient(#fff7d2, #ffffff);
      box-shadow: 0 6px 0 rgba(199, 122, 40, 0.38);
    }

    .course-card.selected::after {
      content: "✓";
      position: absolute;
      right: 8px;
      top: 8px;
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      color: #fff;
      background: #31b46b;
      font-size: 16px;
      font-weight: 950;
    }

    .course-thumb {
      height: 82px;
      margin-bottom: 8px;
      border-radius: 8px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      background:
        linear-gradient(var(--sky, #bdeeff), #fff4d2 52%, var(--floor, #f3c982) 52%),
        linear-gradient(90deg, transparent 45%, rgba(255, 255, 255, 0.46) 45% 55%, transparent 55%);
      overflow: hidden;
    }

    .course-card h3 {
      min-height: 34px;
      margin: 0 0 7px;
      font-size: 15px;
      line-height: 1.15;
      font-weight: 950;
    }

    .course-meta {
      display: grid;
      gap: 5px;
      font-size: 12px;
      font-weight: 850;
      color: #4b5573;
    }

    .course-actions {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 10px;
      margin-top: auto;
    }

    .course-actions button {
      min-height: 52px;
      border: 3px solid rgba(255, 255, 255, 0.9);
      background: linear-gradient(#ffffff, #dff7ff);
      color: #26345d;
      font-size: 16px;
    }

    .course-actions .confirm-button {
      background: linear-gradient(#ffe66d, #ffb347);
      font-size: 18px;
    }

    .settings-screen {
      gap: 14px;
      justify-content: flex-start;
      padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
      background:
        linear-gradient(rgba(255, 249, 232, 0.9), rgba(218, 244, 255, 0.78)),
        radial-gradient(circle at 22% 10%, rgba(255, 255, 255, 0.74), transparent 28%);
      color: #26345d;
      pointer-events: auto;
    }

    .settings-title {
      margin: 2px 0 0;
      color: #26345d;
      font-size: 25px;
      line-height: 1;
      font-weight: 950;
      text-align: center;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.86);
    }

    .settings-panel {
      display: grid;
      gap: 12px;
      padding: 12px;
      border: 4px solid rgba(255, 255, 255, 0.88);
      border-radius: 8px;
      background: linear-gradient(#fffdf3, #e8fbff);
      box-shadow: 0 7px 0 rgba(62, 113, 147, 0.24);
    }

    .setting-row {
      display: grid;
      gap: 8px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.62);
      border: 2px solid rgba(255, 255, 255, 0.86);
    }

    .setting-label {
      font-size: 15px;
      line-height: 1;
      font-weight: 950;
      color: #26345d;
    }

    .setting-options {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 8px;
    }

    .setting-option {
      min-height: 42px;
      padding: 6px 8px;
      border: 3px solid rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      color: #26345d;
      background: linear-gradient(#ffffff, #dff7ff);
      font-size: 14px;
      box-shadow: 0 4px 0 rgba(62, 113, 147, 0.28);
    }

    .setting-option.selected {
      background: linear-gradient(#ffe66d, #ffb347);
      border-color: #fff6d8;
      box-shadow: 0 4px 0 rgba(199, 122, 40, 0.38);
    }

    .settings-actions {
      display: grid;
      grid-template-columns: 1fr;
      margin-top: auto;
    }

    .settings-actions button {
      min-height: 52px;
      border: 3px solid rgba(255, 255, 255, 0.9);
      background: linear-gradient(#ffffff, #dff7ff);
      color: #26345d;
      font-size: 16px;
    }

    .ranking-screen {
      gap: 12px;
      justify-content: flex-start;
      padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
      background:
        linear-gradient(rgba(255, 246, 216, 0.88), rgba(218, 244, 255, 0.76)),
        radial-gradient(circle at 78% 8%, rgba(255, 255, 255, 0.76), transparent 28%);
      color: #26345d;
      pointer-events: auto;
    }

    .ranking-title {
      margin: 2px 0 0;
      color: #26345d;
      font-size: 25px;
      line-height: 1;
      font-weight: 950;
      text-align: center;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.86);
    }

    .ranking-list {
      display: grid;
      gap: 8px;
      max-height: 610px;
      overflow: auto;
      padding: 2px 2px 8px;
    }

    .ranking-row {
      display: grid;
      grid-template-columns: 34px 1fr 48px;
      gap: 8px;
      align-items: center;
      min-height: 74px;
      padding: 8px;
      border-radius: 8px;
      border: 3px solid rgba(255, 255, 255, 0.88);
      background: linear-gradient(#ffffff, #e8fbff);
      box-shadow: 0 4px 0 rgba(62, 113, 147, 0.22);
    }

    .ranking-rank {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      color: #fff;
      background: #ff9f43;
      font-size: 16px;
      font-weight: 950;
    }

    .ranking-main {
      min-width: 0;
    }

    .ranking-name {
      display: block;
      overflow: hidden;
      color: #1f2d4d;
      font-size: 14px;
      font-weight: 950;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ranking-meta {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      color: #4b5573;
      font-size: 11px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ranking-stars {
      color: #d98200;
      font-size: 17px;
      font-weight: 950;
      text-align: right;
    }

    .ranking-empty {
      margin: 30px 0;
      padding: 18px;
      border-radius: 8px;
      border: 3px solid rgba(255, 255, 255, 0.86);
      background: rgba(255, 255, 255, 0.66);
      color: #4b5573;
      text-align: center;
      font-size: 14px;
      font-weight: 850;
    }

    .ranking-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: auto;
    }

    .ranking-actions button {
      min-height: 52px;
      border: 3px solid rgba(255, 255, 255, 0.9);
      background: linear-gradient(#ffffff, #dff7ff);
      color: #26345d;
      font-size: 15px;
    }

    .ranking-actions .reset-button {
      background: linear-gradient(#ffd3d9, #ff9f9f);
    }

    .course-badge {
      width: 100%;
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 8px;
      color: #26345d;
      background: linear-gradient(#ffffff, #dff7ff);
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 3px 0 rgba(62, 113, 147, 0.25);
      text-align: center;
      font-size: 13px;
      font-weight: 900;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <main class="game-shell" aria-label="Ouchi Colon ころころレース">
    <canvas id="gameCanvas" width="390" height="844"></canvas>

    <section id="titleScreen" class="overlay title-screen">
      <div class="title-block">
        <h1 class="brand">Ouchi Colon</h1>
        <p class="subtitle">ころころレース</p>
      </div>
      <div class="title-actions">
        <button id="startButton" class="start-button" type="button">スタート</button>
        <nav class="menu-grid" aria-label="メニュー">
          <button id="characterButton" type="button">キャラクター</button>
          <button id="courseButton" type="button">コース</button>
          <button id="settingsButton" type="button">せってい</button>
          <button id="rankingButton" type="button">ランキング</button>
          <button type="button">おしらせ</button>
        </nav>
      </div>
    </section>

    <section id="raceUi" class="overlay race-ui hidden" aria-label="レース情報">
      <div class="hud">
        <div class="hud-item">
          <span class="hud-label">LAP</span>
          <span id="lapValue" class="hud-value">1/3</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">STAR</span>
          <span id="starValue" class="hud-value">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">SPEED</span>
          <span id="speedValue" class="hud-value">0</span>
        </div>
      </div>
      <div id="courseBadge" class="course-badge">おうちリビングコース</div>
      <button id="backButton" class="back-button" type="button">TITLE</button>
      <button id="jumpButton" class="jump-button" type="button">JUMP</button>
    </section>

    <section id="characterScreen" class="overlay character-screen hidden" aria-label="キャラクター選択">
      <h2 class="character-title">キャラクターせんたく</h2>
      <div class="character-stage">
        <div class="character-hero" aria-hidden="true">
          <div id="selectedPortrait" class="character-portrait">
            <span class="portrait-face"></span>

      const settingGroups = [

      const player = {
        lane: 0,
        targetLane: 0,

        jumpVelocity: 0,
        speed: 0,

        lap: 1,
        stars: 0,

      let worldObjects = [];

      function resetRace() {
        const character = getCharacter(confirmedCharacterId);
        player.lane = 0;
        player.targetLane = 0;
        player.y = 0;
        player.jump = 0;
        player.jumpVelocity = 0;
        player.speed = 82 + character.stats.speed * 5;
        player.distance = 0;
        player.lap = 1;
        player.stars = 0;
        player.hitCooldown = 0;
        worldObjects = makeObjects();
      }

      function makeObjects() {
        const objects = [];
        for (let i = 0; i < 54; i += 1) {
          const kindRoll = i % 8;
          objects.push({
            id: i,
            kind: kindRoll === 0 ? "block" : kindRoll === 3 ? "enemy" : kindRoll === 5 ? "jumpPad" : "star",
            lane: [-0.72, 0, 0.72][(i * 7) % 3],
            distance: 260 + i * 155 + (i % 4) * 38,
            taken: false
          });
        }
        return objects;
      }

      function getCharacter(id) {
        return characters.find((character) => character.id === id) || characters[0];
      }

      function getCourse(id) {
        return courses.find((course) => course.id === id) || courses[0];
      }

      function loadSettings() {
        try {
          const saved = localStorage.getItem(SETTINGS_STORAGE_KEY);
          if (!saved) {
            return { ...defaultSettings };
          }
          return { ...defaultSettings, ...JSON.parse(saved) };
        } catch (error) {
          return { ...defaultSettings };
        }
      }

      function saveSettings() {
        try {
          localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(gameSettings));
        } catch (error) {
          // localStorageが使えない環境でもゲーム自体は動かす。
        }
      }

      function loadRankings() {
        try {
          const saved = localStorage.getItem(RANKING_STORAGE_KEY);
          const rankings = saved ? JSON.parse(saved) : [];
          return Array.isArray(rankings) ? rankings : [];
        } catch (error) {
          return [];
        }
      }

      function saveRankings(rankings) {
        try {
          localStorage.setItem(RANKING_STORAGE_KEY, JSON.stringify(rankings));
        } catch (error) {
          // localStorageが使えない環境でもゲーム自体は動かす。
        }
      }

      function formatDateTime(date) {
        const pad = (value) => String(value).padStart(2, "0");
        return `${date.getFullYear()}/${pad(date.getMonth() + 1)}/${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
      }

      function addRankingEntry() {
        const character = getCharacter(confirmedCharacterId);
        const course = getCourse(confirmedCourseId);
        const entry = {
          characterName: character.name,
          courseName: course.name,
          stars: player.stars,
          lap: `${player.lap}/3`,
          dateTime: formatDateTime(new Date())
        };
        const rankings = loadRankings()
          .concat(entry)
          .sort((a, b) => b.stars - a.stars)
          .slice(0, 10);
        saveRankings(rankings);
      }

      function renderRankings() {
        const rankings = loadRankings()
          .sort((a, b) => b.stars - a.stars)
          .slice(0, 10);
        rankingList.innerHTML = "";

        if (rankings.length === 0) {
          const empty = document.createElement("div");
          empty.className = "ranking-empty";
          empty.textContent = "まだランキングがありません。レースをゴールすると保存されます。";
          rankingList.appendChild(empty);
          return;
        }

        rankings.forEach((entry, index) => {
          const row = document.createElement("div");
          row.className = "ranking-row";

          const rank = document.createElement("span");
          rank.className = "ranking-rank";
          rank.textContent = String(index + 1);

          const main = document.createElement("span");
          main.className = "ranking-main";

          const name = document.createElement("span");
          name.className = "ranking-name";
          name.textContent = `${entry.characterName} / ${entry.courseName}`;

          const meta = document.createElement("span");
          meta.className = "ranking-meta";
          meta.textContent = `LAP ${entry.lap} / ${entry.dateTime}`;

          const stars = document.createElement("span");
          stars.className = "ranking-stars";
          stars.textContent = `★${entry.stars}`;

          main.append(name, meta);
          row.append(rank, main, stars);
          rankingList.appendChild(row);
        });
      }

      function renderSettings() {
        settingsPanel.innerHTML = "";
        for (const group of settingGroups) {
          const row = document.createElement("section");
          row.className = "setting-row";

          const label = document.createElement("div");
          label.className = "setting-label";
          label.textContent = group.label;

          const options = document.createElement("div");
          options.className = "setting-options";

          for (const option of group.options) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = `setting-option${gameSettings[group.key] === option.value ? " selected" : ""}`;
            button.textContent = option.label;
            button.setAttribute("aria-pressed", String(gameSettings[group.key] === option.value));
            button.addEventListener("click", () => {
              gameSettings = { ...gameSettings, [group.key]: option.value };
              saveSettings();
              renderSettings();
            });
            options.appendChild(button);
          }

          row.append(label, options);
          settingsPanel.appendChild(row);
        }
      }

      function setCharacterColors(element, character) {
        element.style.setProperty("--body", character.colors.body);
        element.style.setProperty("--face", character.colors.face);
        element.style.setProperty("--ear", character.colors.ear);
      }

      function renderCharacterGrid() {
        characterGrid.innerHTML = "";
        for (const character of characters) {
          const card = document.createElement("button");
          card.type = "button";
          card.className = `character-card${character.id === selectedCharacterId ? " selected" : ""}`;
          card.dataset.characterId = character.id;
          card.setAttribute("aria-pressed", String(character.id === selectedCharacterId));

          const portrait = document.createElement("span");
          portrait.className = "mini-portrait";
          setCharacterColors(portrait, character);

          const face = document.createElement("span");
          face.className = "mini-face";
          portrait.appendChild(face);

          const label = document.createElement("span");
          label.textContent = character.name;

          card.append(portrait, label);
          card.addEventListener("click", () => {
            selectedCharacterId = character.id;
            renderCharacterSelect();
          });
          characterGrid.appendChild(card);
        }
      }

      function renderCharacterSelect() {
        const character = getCharacter(selectedCharacterId);
        setCharacterColors(selectedPortrait, character);
        selectedName.textContent = character.name;
        selectedDesc.textContent = character.desc;
        speedStat.style.setProperty("--value", character.stats.speed);
        handlingStat.style.setProperty("--value", character.stats.handling);
        weightStat.style.setProperty("--value", character.stats.weight);
        renderCharacterGrid();
      }

      function renderCourseGrid() {
        courseGrid.innerHTML = "";
        for (const course of courses) {
          const card = document.createElement("button");
          card.type = "button";
          card.className = `course-card${course.id === selectedCourseId ? " selected" : ""}`;
          card.dataset.courseId = course.id;
          card.setAttribute("aria-pressed", String(course.id === selectedCourseId));

          const thumb = document.createElement("div");
          thumb.className = "course-thumb";
          thumb.style.setProperty("--sky", course.colors.sky);
          thumb.style.setProperty("--floor", course.colors.floor);

          const title = document.createElement("h3");
          title.textContent = course.name;

          const meta = document.createElement("div");
          meta.className = "course-meta";
          meta.innerHTML = `
            <span>むずかしさ: ${course.meta.difficulty}</span>
            <span>カーブ: ${course.meta.curve}</span>
            <span>アイテム: ${course.meta.items}</span>

          card.append(thumb, title, meta);

      function startRace() {
        const course = getCourse(confirmedCourseId);

        rankingScreen.classList.add("hidden");

      function jump() {
        if (state !== "race" || player.jump > 0.01) {
          return;
        }
        player.jumpVelocity = 9.8;
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function drawRaceViewport(drawScene) {
        ctx.save();
        ctx.translate(VIEW_W / 2, VIEW_H / 2);
        ctx.scale(RACE_VIEW_SCALE, RACE_VIEW_SCALE);
        ctx.translate(-VIEW_W / 2, -VIEW_H / 2);
        drawScene();
        ctx.restore();
      }

      function project(distanceAhead, lane) {
        const depth = clamp(distanceAhead / 900, 0, 1);
        const scale = 1 - depth;
        const roadHalf = lerp(ROAD_TOP, ROAD_BOTTOM, scale);
        const x = VIEW_W / 2 + lane * roadHalf;
        const y = lerp(HORIZON + 6, VIEW_H - 126, scale);
        return { x, y, scale, roadHalf };
      }

      function drawRoomBackground(isTitle = false) {
        const sky = ctx.createLinearGradient(0, 0, 0, HORIZON + 90);
        sky.addColorStop(0, isTitle ? "#ffe7a8" : "#bdeeff");
        sky.addColorStop(0.62, isTitle ? "#ffd3d9" : "#e9fbff");
        sky.addColorStop(1, "#fff4d2");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, VIEW_W, VIEW_H);

        ctx.fillStyle = "#ffef98";
        ctx.beginPath();
        ctx.arc(326, 70, isTitle ? 38 : 28, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#fff9e8";
        ctx.fillRect(34, 52, 126, 86);
        ctx.fillStyle = "#85d9ff";
        ctx.fillRect(42, 60, 52, 70);
        ctx.fillRect(100, 60, 52, 70);
        ctx.strokeStyle = "#e8a55d";
        ctx.lineWidth = 5;
        ctx.strokeRect(34, 52, 126, 86);
        ctx.beginPath();
        ctx.moveTo(97, 55);
        ctx.lineTo(97, 136);
        ctx.moveTo(39, 95);
        ctx.lineTo(156, 95);
        ctx.stroke();
        ctx.fillStyle = "rgba(255, 255, 255, 0.42)";
        ctx.fillRect(48, 66, 24, 10);
        ctx.fillRect(108, 66, 24, 10);

        ctx.fillStyle = "#9a6b4f";
        ctx.fillRect(238, 126, 104, 56);
        ctx.fillStyle = "#72503f";
        ctx.fillRect(248, 116, 84, 22);
        ctx.fillStyle = "#f2b36b";
        ctx.fillRect(252, 138, 28, 34);
        ctx.fillRect(298, 138, 28, 34);

        ctx.fillStyle = "#6f5c47";
        ctx.fillRect(14, 170, 76, 12);
        ctx.fillRect(24, 182, 8, 42);
        ctx.fillRect(72, 182, 8, 42);
        ctx.fillStyle = "#f7c9d3";
        ctx.beginPath();
        ctx.roundRect(16, 144, 72, 30, 8);
        ctx.fill();

        ctx.fillStyle = "#c27842";
        ctx.fillRect(328, 184, 30, 42);
        ctx.fillStyle = "#3b9d5a";
        for (const leaf of [[329, 174, 18, 8, -0.6], [357, 174, 18, 8, 0.6], [342, 154, 15, 8, 0], [333, 160, 14, 7, -0.9], [354, 160, 14, 7, 0.9]]) {
          ctx.save();
          ctx.translate(leaf[0], leaf[1]);
          ctx.rotate(leaf[4]);
          ctx.beginPath();
          ctx.ellipse(0, 0, leaf[2], leaf[3], 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        ctx.fillStyle = "#f05d5e";
        ctx.beginPath();
        ctx.arc(72, 250, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#5ac8fa";
        ctx.fillRect(290, 238, 28, 28);
        ctx.fillStyle = "#ffd166";
        ctx.beginPath();
        ctx.moveTo(48, 294);
        ctx.lineTo(76, 294);
        ctx.lineTo(62, 272);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = isTitle ? "#f8d99b" : "#69b86e";
        ctx.beginPath();
        ctx.moveTo(0, HORIZON + 36);
        ctx.lineTo(82, HORIZON + 2);
        ctx.lineTo(158, HORIZON + 34);
        ctx.lineTo(234, HORIZON - 4);
        ctx.lineTo(390, HORIZON + 46);
        ctx.lineTo(390, VIEW_H);
        ctx.lineTo(0, VIEW_H);
        ctx.closePath();
        ctx.fill();
      }

      function drawRoad() {
        ctx.fillStyle = "#f3c982";
        ctx.fillRect(0, HORIZON, VIEW_W, VIEW_H - HORIZON);

        ctx.fillStyle = "#65b7db";
        ctx.beginPath();
        ctx.moveTo(VIEW_W / 2 - ROAD_TOP, HORIZON);
        ctx.lineTo(VIEW_W / 2 + ROAD_TOP, HORIZON);
        ctx.lineTo(VIEW_W / 2 + ROAD_BOTTOM, VIEW_H);
        ctx.lineTo(VIEW_W / 2 - ROAD_BOTTOM, VIEW_H);
        ctx.closePath();
        ctx.fill();

        for (let i = 0; i < 18; i += 1) {
          const stripe = (i * 76 - (player.distance % 76)) / 900;
          const near = clamp(stripe, 0, 1);
          const far = clamp(stripe + 0.035, 0, 1);
          const y1 = lerp(VIEW_H, HORIZON, near);
          const y2 = lerp(VIEW_H, HORIZON, far);
          const half1 = lerp(ROAD_BOTTOM, ROAD_TOP, near);
          const half2 = lerp(ROAD_BOTTOM, ROAD_TOP, far);

          ctx.fillStyle = i % 2 === 0 ? "#fff7df" : "#ff8fab";
          ctx.beginPath();
          ctx.moveTo(VIEW_W / 2 - half1, y1);
          ctx.lineTo(VIEW_W / 2 - half1 + 16, y1);
          ctx.lineTo(VIEW_W / 2 - half2 + 4, y2);
          ctx.lineTo(VIEW_W / 2 - half2, y2);
          ctx.closePath();
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(VIEW_W / 2 + half1, y1);
          ctx.lineTo(VIEW_W / 2 + half1 - 16, y1);
          ctx.lineTo(VIEW_W / 2 + half2 - 4, y2);
          ctx.lineTo(VIEW_W / 2 + half2, y2);
          ctx.closePath();
          ctx.fill();
        }

        ctx.strokeStyle = "rgba(255, 255, 255, 0.62)";
        ctx.lineWidth = 2;
        for (const lane of [-0.36, 0.36]) {
          ctx.beginPath();
          for (let i = 0; i <= 18; i += 1) {
            const t = i / 18;
            const half = lerp(ROAD_TOP, ROAD_BOTTOM, t);
            const x = VIEW_W / 2 + lane * half;
            const y = lerp(HORIZON, VIEW_H, t);
            if (i === 0) {
              ctx.moveTo(x, y);
            } else {
              ctx.lineTo(x, y);
            }
          }
          ctx.stroke();
        }
      }

      function drawStar(x, y, size) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(performance.now() / 260);
        ctx.fillStyle = "#ffdf3f";
        ctx.strokeStyle = "#d98200";
        ctx.lineWidth = Math.max(1, size * 0.08);
        ctx.beginPath();
        for (let i = 0; i < 10; i += 1) {
          const radius = i % 2 === 0 ? size : size * 0.45;
          const angle = -Math.PI / 2 + i * Math.PI / 5;
          const px = Math.cos(angle) * radius;
          const py = Math.sin(angle) * radius;
          if (i === 0) {
            ctx.moveTo(px, py);
          } else {
            ctx.lineTo(px, py);
          }
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "rgba(255, 255, 255, 0.78)";
        ctx.beginPath();
        ctx.arc(-size * 0.18, -size * 0.16, size * 0.12, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawObstacle(object, point) {
        const size = lerp(8, 60, point.scale);
        if (object.kind === "star") {
          drawStar(point.x, point.y - size * 0.55, size * 0.42);
          return;
        }

        if (object.kind === "enemy") {
          ctx.fillStyle = "#8d69e8";
          ctx.beginPath();
          ctx.arc(point.x, point.y - size * 0.34, size * 0.38, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#7a5dd5";
          ctx.beginPath();
          ctx.arc(point.x - size * 0.28, point.y - size * 0.62, size * 0.16, 0, Math.PI * 2);
          ctx.arc(point.x + size * 0.28, point.y - size * 0.62, size * 0.16, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#fff7df";
          ctx.beginPath();
          ctx.arc(point.x - size * 0.14, point.y - size * 0.42, size * 0.07, 0, Math.PI * 2);
          ctx.arc(point.x + size * 0.14, point.y - size * 0.42, size * 0.07, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#4a377c";
          ctx.lineWidth = Math.max(1, size * 0.04);
          ctx.beginPath();
          ctx.arc(point.x, point.y - size * 0.25, size * 0.12, 0, Math.PI);
          ctx.stroke();
          return;
        }

        if (object.kind === "jumpPad") {
          ctx.fillStyle = "#6ee7f2";
          ctx.beginPath();
          ctx.roundRect(point.x - size * 0.46, point.y - size * 0.28, size * 0.92, size * 0.3, size * 0.08);
          ctx.fill();
          ctx.fillStyle = "#fff7df";
          ctx.beginPath();
          ctx.moveTo(point.x, point.y - size * 0.72);
          ctx.lineTo(point.x - size * 0.25, point.y - size * 0.32);
          ctx.lineTo(point.x + size * 0.25, point.y - size * 0.32);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = "#2c9aa8";
          ctx.lineWidth = Math.max(1, size * 0.05);
          ctx.stroke();
          return;
        }

        ctx.fillStyle = "#ff9f68";
        ctx.beginPath();
        ctx.roundRect(point.x - size * 0.45, point.y - size * 0.78, size * 0.9, size * 0.74, size * 0.08);
        ctx.fill();
        ctx.fillStyle = "#ffd166";
        ctx.fillRect(point.x - size * 0.34, point.y - size * 0.68, size * 0.68, size * 0.14);
        ctx.fillStyle = "#fff7df";
        ctx.beginPath();
        ctx.arc(point.x - size * 0.16, point.y - size * 0.36, size * 0.05, 0, Math.PI * 2);
        ctx.arc(point.x + size * 0.16, point.y - size * 0.36, size * 0.05, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#9d5630";
        ctx.lineWidth = Math.max(1, size * 0.035);
        ctx.strokeRect(point.x - size * 0.45, point.y - size * 0.78, size * 0.9, size * 0.74);
      }

      function drawPlayer() {
        const character = getCharacter(confirmedCharacterId);
        const baseX = VIEW_W / 2 + player.lane * 118;
        const floatHeight = player.jump * 70;
        const baseY = VIEW_H - 118 - floatHeight;
        const squash = player.jump > 0 ? 1 : 1 + Math.sin(performance.now() / 100) * 0.03;

        const shadowScale = clamp(1 - player.jump * 0.32, 0.46, 1);
        ctx.fillStyle = `rgba(35, 31, 32, ${0.26 * shadowScale})`;
        ctx.beginPath();
        ctx.ellipse(baseX, VIEW_H - 64, 44 * shadowScale, 12 * shadowScale, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.translate(baseX, baseY);
        ctx.scale(1, squash);

        ctx.fillStyle = character.colors.ear;
        ctx.beginPath();
        ctx.ellipse(-30, -24, 14, 24, -0.65, 0, Math.PI * 2);
        ctx.ellipse(30, -24, 14, 24, 0.65, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#86d8ff";
        ctx.beginPath();
        ctx.ellipse(-28, -21, 7, 14, -0.65, 0, Math.PI * 2);
        ctx.ellipse(28, -21, 7, 14, 0.65, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = character.colors.body;
        ctx.beginPath();
        ctx.arc(0, 0, 38, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = character.colors.face;
        ctx.beginPath();
        ctx.roundRect(-26, -16, 52, 34, 14);
        ctx.fill();

        ctx.fillStyle = "#fff7df";
        ctx.beginPath();
        ctx.arc(-12, -4, 7, 0, Math.PI * 2);
        ctx.arc(12, -4, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#1d2738";
        ctx.beginPath();
        ctx.arc(-10, -3, 3, 0, Math.PI * 2);
        ctx.arc(10, -3, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#fff7df";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 6, 9, 0.1, Math.PI - 0.1);
        ctx.stroke();

        ctx.fillStyle = character.colors.body;
        ctx.beginPath();
        ctx.ellipse(-18, 34, 13, 16, 0, 0, Math.PI * 2);
        ctx.ellipse(18, 34, 13, 16, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawTitleScene() {
        drawRoomBackground(true);
        ctx.fillStyle = "rgba(255, 255, 255, 0.34)";
        ctx.beginPath();
        ctx.roundRect(34, 334, 322, 150, 18);
        ctx.fill();
        ctx.fillStyle = "#f08fb5";
        ctx.beginPath();
        ctx.arc(104, 422, 28, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#69d2e7";
        ctx.fillRect(256, 390, 48, 48);
        ctx.fillStyle = "#f9d56e";
        ctx.beginPath();
        ctx.moveTo(190, 350);
        ctx.lineTo(224, 414);
        ctx.lineTo(156, 414);
        ctx.closePath();
        ctx.fill();
        player.distance += 0.9;
        const demoPoint = project(135, Math.sin(performance.now() / 800) * 0.55);
        drawStar(demoPoint.x, demoPoint.y - 34, 22);
      }

      function updateRace(delta) {
        const character = getCharacter(confirmedCharacterId);
        const targetSpeed = 100 + character.stats.speed * 8;
        const handling = 1.28 + character.stats.handling * 0.15;
        const direction = (keys.has("ArrowRight") || keys.has("KeyD") ? 1 : 0) - (keys.has("ArrowLeft") || keys.has("KeyA") ? 1 : 0);
        if (direction !== 0) {
          player.targetLane = clamp(player.targetLane + direction * delta * handling, -1, 1);
        }
        player.lane = lerp(player.lane, player.targetLane, clamp(delta * (7 + character.stats.handling), 0, 1));

        player.speed = lerp(player.speed, targetSpeed, delta * 0.16);
        player.distance += player.speed * delta;

        if (player.distance >= COURSE_LENGTH) {
          player.distance -= COURSE_LENGTH;
          if (player.lap >= 3) {
            addRankingEntry();
            showRanking();
            return;
          }
          player.lap += 1;
          worldObjects = makeObjects();
        }

        if (player.jumpVelocity !== 0 || player.jump > 0) {
          player.jump += player.jumpVelocity * delta;
          player.jumpVelocity -= 24 * delta;
          if (player.jump <= 0) {
            player.jump = 0;
            player.jumpVelocity = 0;
          }
        }

        player.hitCooldown = Math.max(0, player.hitCooldown - delta);

        for (const object of worldObjects) {
          if (object.taken) {
            continue;
          }

          let ahead = object.distance - player.distance;
          if (ahead < -90) {
            object.distance += COURSE_LENGTH;
            object.taken = false;
            ahead = object.distance - player.distance;
          }

          if (ahead > 18 && ahead < 82 && Math.abs(object.lane - player.lane) < 0.34) {
            if (object.kind === "star") {
              object.taken = true;
              player.stars += 1;
              player.speed = Math.min(150, player.speed + 8);
            } else if (object.kind === "jumpPad") {
              object.taken = true;
              player.jumpVelocity = Math.max(player.jumpVelocity, 11.5);
              player.speed = Math.min(154, player.speed + 12);
            } else if (player.hitCooldown <= 0 && !(player.jump > 0.45 && object.kind === "block")) {
              player.speed = 30 + character.stats.weight * 5;
              player.hitCooldown = 0.9;
            }
          }
        }

        lapValue.textContent = `${player.lap}/3`;
        starValue.textContent = String(player.stars);
        speedValue.textContent = String(Math.round(player.speed));
      }

      function drawRace() {
        drawRoomBackground(false);
        drawRaceViewport(() => {
          drawRoomBackground(false);
          drawRoad();

          const visible = worldObjects
            .filter((object) => !object.taken)
            .map((object) => ({ object, ahead: object.distance - player.distance }))
            .filter((entry) => entry.ahead > 20 && entry.ahead < 900)
            .sort((a, b) => b.ahead - a.ahead);

          for (const entry of visible) {
            drawObstacle(entry.object, project(entry.ahead, entry.object.lane));
          }

          drawPlayer();
        });

        if (player.hitCooldown > 0) {
          ctx.fillStyle = "rgba(255, 90, 95, 0.22)";
          ctx.fillRect(0, 0, VIEW_W, VIEW_H);
        }
      }

      function loop(now) {
        const delta = Math.min(0.033, (now - lastTime) / 1000);
        lastTime = now;

        if (state === "race") {
          updateRace(delta);
          drawRace();
        } else {
          drawTitleScene();
        }

        requestAnimationFrame(loop);
      }

      function handlePointer(event) {
        if (state !== "race") {
          return;
        }

        const rect = canvas.getBoundingClientRect();
        const x = event.clientX - rect.left;
        if (x < rect.width * 0.42) {
          player.targetLane = clamp(player.targetLane - 0.42, -1, 1);
        } else if (x > rect.width * 0.58) {
          player.targetLane = clamp(player.targetLane + 0.42, -1, 1);
        }
      }

      startButton.addEventListener("click", startRace);
      characterButton.addEventListener("click", showCharacterSelect);
      courseButton.addEventListener("click", showCourseSelect);
      settingsButton.addEventListener("click", showSettings);
      rankingButton.addEventListener("click", showRanking);
      backButton.addEventListener("click", showTitle);
      jumpButton.addEventListener("click", jump);
      characterBackButton.addEventListener("click", showTitle);
      characterConfirmButton.addEventListener("click", confirmCharacterSelect);
      characterHelpButton.addEventListener("click", () => {
        const character = getCharacter(selectedCharacterId);
        selectedDesc.textContent = `${character.desc} 下のカードをタップして、けっていでレースに使えます。`;
      });
      courseBackButton.addEventListener("click", showTitle);
      courseConfirmButton.addEventListener("click", confirmCourseSelect);
      settingsBackButton.addEventListener("click", showTitle);
      rankingBackButton.addEventListener("click", showTitle);
      rankingResetButton.addEventListener("click", resetRankings);
      canvas.addEventListener("pointerdown", handlePointer);

      window.addEventListener("keydown", (event) => {
        keys.add(event.code);
        if (event.code === "Space" || event.code === "ArrowUp") {
          event.preventDefault();
          jump();
        }
      });

      window.addEventListener("keyup", (event) => {
        keys.delete(event.code);
      });

      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
